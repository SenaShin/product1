<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lotto Number Generator</title>
  <link href='/style.css' rel='stylesheet'>
</head>
<body>
  <div class="container">
    <button id="theme-toggle-btn" style="float: right;">Toggle Theme</button>
    <h1>Lotto Number Generator</h1>
    <div id="numbers" class="numbers-container"></div>
    <button id="generate-btn">Generate Numbers</button>
  </div>

  <div class="container contact-form-container">
    <h2>Alliance Inquiry</h2>
    <form action="https://formspree.io/f/xaqdnzek" method="POST" id="alliance-inquiry-form">
      <label for="email">Your Email:</label>
      <input type="email" id="email" name="email" required>
      <label for="message">Your Message:</label>
      <textarea id="message" name="message" rows="5" required></textarea>
      <button type="submit">Send</button>
    </form>
  </div>
  <script defer type="text/javascript" src="/main.js"></script>
</body>
</html>
